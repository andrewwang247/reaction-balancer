[project]
name = "reaction-balancer"
version = "0.1.0"
description = "A chemical reaction balancer that solves user-provided equations."
authors = [{ name = "Andrew Wang", email = "siweiw9@gmail.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["click", "numpy", "sympy"]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pytest"]

[project.urls]
Repository = "https://github.com/andrewwang247/reaction-balancer"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "S101", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "sympy.*"
ignore_missing_imports = true

[tool.pytest]
addopts = ["-ra", "--strict-markers"]
testpaths = ["test"]
